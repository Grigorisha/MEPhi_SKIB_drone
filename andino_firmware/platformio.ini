[env:uno]
platform = atmelavr
board = uno
framework = arduino

; Serial monitor settings (matches README.md)
monitor_speed = 57600

; app.cpp подключает Adafruit_BNO055 — без этой зависимости сборка падает.
lib_deps =
  adafruit/Adafruit BNO055

; The firmware is provided as a .ino at the package root.
; If you use PlatformIO, you may want to move it under src/ or adjust src_dir.
