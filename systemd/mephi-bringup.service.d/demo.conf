# Дополнение к mephi-bringup.service. Ставится setup_demo_system.sh.

[Unit]
# ros2_control_node в Humble отсчитывает период цикла по системным часам.
# Если NTP переведёт часы вперёд уже после старта, цикл управления крутится
# без пауз, пока не «догонит» скачок: после месяца простоя — часами на пределе
# обмена с Arduino (так было 26.09.2026: 105 Гц вместо 50). Поэтому стартуем
# после синхронизации времени. Без интернета ожидание сдаётся через 30 с.
Wants=time-sync.target
After=time-sync.target

[Service]
# ros2-daemon, которого launch поднимает внутри сервиса, не реагирует на
# SIGTERM — остановка висела 90 секунд до SIGKILL.
TimeoutStopSec=15
