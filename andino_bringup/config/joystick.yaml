# Геймпад Xbox по Bluetooth. Управление как в World of Tanks Blitz — всё на
# левом стике: вверх/вниз — вперёд/назад, влево/вправо — поворот.
#
# Пульт сопрягается один раз (mephi_hw_tests/pair_gamepad.sh) и дальше
# подключается сам при включении кнопкой Xbox.

joy_node:          # так на самом деле называется нода joy_linux_node
  ros__parameters:
    dev: /dev/input/js0
    deadzone: 0.12
    autorepeat_rate: 20.0

teleop_node:
  ros__parameters:
    # Без кнопки удержания: едем, пока отклонён стик; отпустили — стоп.
    # Для «мёртвой руки» поставить true — тогда ехать только с зажатой LB.
    require_enable_button: false
    enable_button: 4
    enable_turbo_button: -1

    axis_linear:
      x: 1          # левый стик вверх/вниз
    scale_linear:
      x: 0.5        # стик в упор = полный ШИМ (kFullSpeed в diffdrive_andino.cpp)

    axis_angular:
      yaw: 0        # левый стик влево/вправо
    scale_angular:
      yaw: 6.5      # стик вбок в упор = разворот на месте на полном ШИМ
