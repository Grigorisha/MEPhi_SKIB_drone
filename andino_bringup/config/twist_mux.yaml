# Мультиплексор команд скорости.
#
# Без него джойстик и навигация пишут в /cmd_vel одновременно и перебивают
# друг друга, а у оператора нет способа перехватить управление, если робот
# поехал не туда. Приоритет выше — источник главнее.
#
# Схема:
#   джойстик   -> /cmd_vel_joy       приоритет 30  (человек всегда главнее)
#   клавиатура -> /cmd_vel_keyboard  приоритет 20
#   навигация  -> /cmd_vel_nav       приоритет 10  (Nav2 уступает человеку)
#
# Выход ноды (/cmd_vel_out) ремапится в /cmd_vel — тему, которую слушает
# diff_controller. Поэтому навигация и заведена на отдельную cmd_vel_nav:
# если оставить её на /cmd_vel, получится петля вход-выход.
#
# timeout — через сколько секунд молчания источник считается неактивным.

twist_mux:
  ros__parameters:
    topics:
      navigation:
        topic   : cmd_vel_nav
        timeout : 0.5
        priority: 10
      keyboard:
        topic   : cmd_vel_keyboard
        timeout : 0.5
        priority: 20
      joy:
        topic   : cmd_vel_joy
        timeout : 0.5
        priority: 30
